<title>Vampiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Rubik:wght@400;600&display=swap">
<style>
  /* Diseño: un solo mundo nocturno (sin tema claro); el lienzo ocupa toda la pantalla
     y los botones de poderes flotan a la derecha, al alcance del pulgar. */
  :root {
    --noche: #0b0916;        /* fondo */
    --sangre: #c8142a;       /* acento principal */
    --niebla: #9b2fd0;       /* poder de niebla */
    --hueso: #efe9e1;        /* texto */
    --luna: #e8e4c9;
    --display: "Pirata One", "Georgia", serif;
    --cuerpo: "Rubik", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--noche);
    color: var(--hueso);
    font-family: var(--cuerpo);
    overflow: hidden;
    touch-action: none;              /* evita zoom y scroll al jugar con el dedo */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #escena {
    position: relative;
    height: 100%;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  canvas { display: block; border-radius: 6px; box-shadow: 0 0 0 1px #2a2440; }

  /* Columna de botones de poderes (abajo a la derecha) */
  #poderes {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }
  .poder {
    position: relative;
    width: 88px; height: 88px;
    border-radius: 50%;
    border: 2px solid var(--color);
    background: color-mix(in srgb, var(--color) 30%, transparent);
    color: var(--hueso);
    font: 600 11px/1.1 var(--cuerpo);
    letter-spacing: .02em;
    text-transform: uppercase;
    display: grid; place-items: center;
    touch-action: none;
    overflow: hidden;
  }
  .poder:active { background: var(--color); }
  .poder:focus-visible { outline: 3px solid var(--luna); outline-offset: 3px; }
  .poder svg { width: 38px; height: 22px; fill: var(--hueso); display: block; margin: 0 auto 4px; }
  .poder span { position: relative; z-index: 1; }
  /* Relleno que sube según la carga del poder de niebla */
  .poder .carga {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 0%;
    background: color-mix(in srgb, var(--color) 55%, transparent);
  }
  .poder.listo { box-shadow: 0 0 18px var(--color); }
  .poder:disabled { opacity: .55; }
  #btn-murcielago { --color: var(--sangre); }
  #btn-niebla { --color: var(--niebla); }
  /* Botón de silenciar: abajo a la izquierda */
  #btn-sonido {
    position: fixed;
    left: calc(16px + env(safe-area-inset-left, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1.5px solid rgba(239,233,225,.35);
    background: rgba(20,16,30,.6);
    display: grid; place-items: center;
    touch-action: none;
  }
  #btn-sonido svg { width: 26px; height: 26px; fill: none; stroke: var(--hueso); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #btn-sonido:focus-visible { outline: 3px solid var(--luna); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .poder { transition: none; } }
</style>

<div id="escena">
  <canvas id="lienzo" aria-label="Juego Vampiro"></canvas>
</div>
<div id="poderes">
  <button id="btn-niebla" class="poder" type="button" aria-label="Niebla roja">
    <div class="carga" id="carga-niebla"></div>
    <span>
      <svg viewBox="0 0 40 22" aria-hidden="true"><path d="M4 14a5 5 0 0 1 5-5 7 7 0 0 1 13-2 6 6 0 0 1 10 4 4 4 0 0 1 4 7H6a4 4 0 0 1-2-4z"/></svg>
      Niebla
    </span>
  </button>
  <button id="btn-murcielago" class="poder" type="button" aria-label="Forma de murciélago">
    <span>
      <svg viewBox="0 0 40 22" aria-hidden="true"><path d="M20 6c2 0 3 2 3 4 4-6 10-8 17-6-4 2-5 5-5 9-3-2-6-2-9 1-2-2-4-2-6 2-2-4-4-4-6-2-3-3-6-3-9-1 0-4-1-7-5-9 7-2 13 0 17 6 0-2 1-4 3-4z"/></svg>
      Murciélago
    </span>
  </button>
</div>

<button id="btn-sonido" type="button" aria-label="Silenciar sonido">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z"/>
    <g id="icono-ondas"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
    <g id="icono-mute" style="display:none"><path d="M16 9l6 6M22 9l-6 6"/></g>
  </svg>
</button>

<script>
/* =====================================================================
   VAMPIRO (versión web)
   - Sobrevive cada noche (60 s) hasta el amanecer para pasar a la siguiente.
   - Muerde aldeanos para recuperar sangre y cargar la Niebla roja.
   - Murciélago: impulso que atraviesa y elimina cazadores (cuesta sangre).
   - Niebla roja: onda que elimina a los cazadores cercanos (se carga mordiendo).
   Controles: arrastrar el dedo (joystick) o flechas/WASD; ESPACIO = murciélago,
   E = niebla.
   ===================================================================== */

// ---- Configuración -------------------------------------------------------
const ANCHO = 540, ALTO = 960;           // tamaño lógico del mundo (vertical 9:16)
const SANGRE_MAX = 100;
const PERDIDA_SANGRE_SEG = 3.5;          // sangre perdida por segundo
const SANGRE_POR_MORDIDA = 25;
const DANO_CAZADOR = 25;
const COSTO_MURCIELAGO = 8;
const INVULNERABLE_SEG = 1;
const MAX_ALDEANOS = 6;
const DURACION_NOCHE = 60;               // segundos hasta el amanecer
const MORDIDAS_PARA_NIEBLA = 4;          // mordidas necesarias para cargar la niebla
const RADIO_NIEBLA = 230;                // alcance de la onda de niebla

// Dificultad según el número de noche
const maxCazadores = (n) => Math.min(12, 2 + n * 2);
const velCazador = (n, t) => Math.min(190, 70 + n * 12 + t * 0.8);
const intervaloSpawn = (n) => Math.max(1.4, 5 - n * 0.5);

// ---- Utilidades ----------------------------------------------------------
const largo = (v) => Math.hypot(v.x, v.y);
const normal = (v) => { const l = largo(v) || 1; return { x: v.x / l, y: v.y / l }; };
const resta = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const azar = (min, max) => min + Math.random() * (max - min);
const elegir = (lista) => lista[Math.floor(Math.random() * lista.length)];
const limitar = (p, r) => {             // mantener dentro de la pantalla
  p.x = Math.max(r, Math.min(ANCHO - r, p.x));
  p.y = Math.max(r, Math.min(ALTO - r, p.y));
};
function puntoEnBorde() {               // lugar de aparición de cazadores
  const lado = Math.floor(Math.random() * 4);
  if (lado === 0) return { x: azar(0, ANCHO), y: 15 };
  if (lado === 1) return { x: azar(0, ANCHO), y: ALTO - 15 };
  if (lado === 2) return { x: 15, y: azar(0, ALTO) };
  return { x: ANCHO - 15, y: azar(0, ALTO) };
}

// ---- Sonido y música (Web Audio, todo sintetizado, sin archivos) ----------
// El navegador solo deja sonar audio después de que el jugador toca la pantalla,
// por eso Sonido.iniciar() se llama en el primer toque o tecla.
const Sonido = {
  ctx: null,
  silencio: false,
  paso: 0,                               // paso actual de la música (corcheas)
  proximo: 0,                            // momento del siguiente paso programado
  tLatido: 0,                            // cuenta regresiva del latido

  iniciar() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;                     // navegador sin audio: el juego sigue sin sonido
    const c = this.ctx = new AC();
    // Mezcla: efectos y música por separado hacia un volumen maestro
    this.maestro = c.createGain();
    this.maestro.gain.value = this.silencio ? 0 : 0.8;
    this.maestro.connect(c.destination);
    this.efectos = c.createGain(); this.efectos.gain.value = 0.7; this.efectos.connect(this.maestro);
    this.musica = c.createGain(); this.musica.gain.value = 0.3; this.musica.connect(this.maestro);
    // Eco sombrío para la música (retardo con realimentación filtrada)
    const eco = c.createDelay(); eco.delayTime.value = 0.36;
    const reali = c.createGain(); reali.gain.value = 0.32;
    const filtro = c.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = 1800;
    this.musica.connect(eco); eco.connect(filtro); filtro.connect(reali); reali.connect(eco);
    filtro.connect(this.maestro);
    // Búfer de ruido blanco reutilizable (mordidas, aleteos, niebla)
    this.ruidoBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const datos = this.ruidoBuf.getChannelData(0);
    for (let i = 0; i < datos.length; i++) datos[i] = Math.random() * 2 - 1;
    this.proximo = c.currentTime + 0.1;
    setInterval(() => this.programarMusica(), 25);   // programador con margen
  },

  alternar() {                           // silenciar / activar
    this.silencio = !this.silencio;
    try { localStorage.setItem('vampiro-silencio', this.silencio ? '1' : '0'); } catch (_) {}
    if (this.ctx) this.maestro.gain.setTargetAtTime(this.silencio ? 0 : 0.8, this.ctx.currentTime, 0.05);
    pintarBotonSonido();
  },

  // Nota simple con envolvente (ataque rápido, caída exponencial)
  tono(freq, dur, { tipo = 'sine', vol = 0.3, cuando = 0, hasta = null, destino = null } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + cuando;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo;
    o.frequency.setValueAtTime(freq, t);
    if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t + dur);   // deslizamiento de tono
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(destino || this.efectos);
    o.start(t); o.stop(t + dur + 0.05);
  },

  // Ráfaga de ruido filtrado (con barrido opcional de frecuencia)
  ruido(dur, { freq = 1000, hasta = null, tipo = 'bandpass', vol = 0.3, cuando = 0, q = 1 } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + cuando;
    const src = c.createBufferSource(); src.buffer = this.ruidoBuf;
    const f = c.createBiquadFilter(); f.type = tipo; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (hasta) f.frequency.exponentialRampToValueAtTime(hasta, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.efectos);
    src.start(t); src.stop(t + dur + 0.05);
  },

  // ---- Efectos del juego ----
  mordida() {
    this.ruido(0.18, { freq: 700, hasta: 200, tipo: 'lowpass', vol: 0.5 });
    this.tono(220, 0.2, { tipo: 'triangle', hasta: 90, vol: 0.35 });
    this.tono(520, 0.12, { tipo: 'sine', vol: 0.12, cuando: 0.06 });   // pequeño "glup"
  },
  golpe() {
    this.tono(130, 0.35, { tipo: 'square', hasta: 45, vol: 0.25 });
    this.ruido(0.25, { freq: 400, tipo: 'lowpass', vol: 0.5 });
  },
  murcielago() {
    this.ruido(0.35, { freq: 2600, hasta: 500, vol: 0.45, q: 3 });
    for (let i = 0; i < 3; i++) this.ruido(0.05, { freq: 1200, vol: 0.25, cuando: i * 0.08 });   // aleteos
  },
  eliminar() {
    this.tono(520, 0.15, { tipo: 'triangle', hasta: 1300, vol: 0.25 });
    this.tono(980, 0.18, { tipo: 'sine', vol: 0.12, cuando: 0.05 });
    this.ruido(0.12, { freq: 3000, vol: 0.15 });
  },
  niebla() {
    this.ruido(1.1, { freq: 300, hasta: 3000, vol: 0.5, q: 0.7 });
    this.tono(110, 1.0, { tipo: 'sawtooth', hasta: 40, vol: 0.18 });
    this.tono(165, 1.0, { tipo: 'sawtooth', hasta: 60, vol: 0.12 });
  },
  nieblaLista() {                        // campanita: el poder está cargado
    [880, 1320].forEach((f, i) => this.tono(f, 0.4, { tipo: 'sine', vol: 0.15, cuando: i * 0.09 }));
  },
  cazadorAparece() {                     // cuerno grave y lejano
    this.tono(98, 0.5, { tipo: 'sawtooth', vol: 0.05 });
    this.tono(147, 0.5, { tipo: 'triangle', vol: 0.05 });
  },
  latido() {                             // "pum-pum" cuando queda poca sangre
    this.tono(65, 0.15, { tipo: 'sine', hasta: 40, vol: 0.6 });
    this.tono(60, 0.15, { tipo: 'sine', hasta: 38, vol: 0.45, cuando: 0.18 });
  },
  amanecer() {                           // acorde mayor ascendente: ¡victoria!
    [523, 659, 784, 1047].forEach((f, i) => this.tono(f, 0.9, { tipo: 'triangle', vol: 0.18, cuando: i * 0.12 }));
  },
  derrota() {                            // notas menores que bajan
    [440, 415, 392, 330].forEach((f, i) => this.tono(f, 0.6, { tipo: 'triangle', vol: 0.2, cuando: i * 0.25 }));
    this.tono(110, 1.6, { tipo: 'sawtooth', hasta: 55, vol: 0.1, cuando: 0.9 });
  },

  // ---- Música: arpegio de clavecín sobre bajo en La menor armónica ----
  // Acordes (MIDI): Am, F, Dm, Mi mayor; un compás de 8 corcheas cada uno.
  ACORDES: [[57, 60, 64], [53, 57, 60], [50, 53, 57], [52, 56, 59]],
  PATRON: [0, 1, 2, 3, 2, 1, 2, 1],      // índice de nota del arpegio (3 = octava)

  programarMusica() {
    const c = this.ctx;
    if (!c) return;
    // En los menús la música baja de volumen; en partida suena completa
    const objetivo = estado === 'jugando' ? 0.3 : 0.1;
    this.musica.gain.setTargetAtTime(objetivo, c.currentTime, 0.3);
    // Más rápida en cada noche
    const bpm = 96 + Math.min(8, (noche || 1) - 1) * 7;
    const corchea = 60 / bpm / 2;
    while (this.proximo < c.currentTime + 0.12) {
      this.tocarPaso(this.paso, this.proximo - c.currentTime, corchea);
      this.proximo += corchea;
      this.paso++;
    }
  },
  tocarPaso(paso, cuando, corchea) {
    const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const acorde = this.ACORDES[Math.floor(paso / 8) % 4];
    const i = this.PATRON[paso % 8];
    const nota = i === 3 ? acorde[0] + 12 : acorde[i];
    // Clavecín: onda cuadrada corta
    this.tono(midi(nota + 12), corchea * 1.6, { tipo: 'square', vol: 0.05, cuando, destino: this.musica });
    // Bajo en los tiempos fuertes
    if (paso % 4 === 0) this.tono(midi(acorde[0] - 12), corchea * 3.5, { tipo: 'triangle', vol: 0.22, cuando, destino: this.musica });
    // Colchón de órgano al inicio de cada compás
    if (paso % 8 === 0) acorde.forEach((n) => this.tono(midi(n), corchea * 8, { tipo: 'sine', vol: 0.04, cuando, destino: this.musica }));
    // Campana fantasmal cada 4 compases
    if (paso % 32 === 28) this.tono(midi(acorde[2] + 24), 1.5, { tipo: 'sine', vol: 0.05, cuando, destino: this.musica });
  },

  // Latido periódico si la sangre está baja (se llama cada cuadro)
  actualizar(dt) {
    if (estado !== 'jugando' || vampiro.sangre >= 30) { this.tLatido = 0; return; }
    this.tLatido -= dt;
    if (this.tLatido <= 0) { this.latido(); this.tLatido = vampiro.sangre < 15 ? 0.55 : 0.85; }
  },
};

// Preferencia de silencio guardada en el navegador
try { Sonido.silencio = localStorage.getItem('vampiro-silencio') === '1'; } catch (_) {}
function pintarBotonSonido() {
  document.getElementById('icono-ondas').style.display = Sonido.silencio ? 'none' : '';
  document.getElementById('icono-mute').style.display = Sonido.silencio ? '' : 'none';
  document.getElementById('btn-sonido').setAttribute('aria-label', Sonido.silencio ? 'Activar sonido' : 'Silenciar sonido');
}
pintarBotonSonido();
// Desbloquear el audio con el primer toque o tecla (fase de captura: va antes que todo)
document.addEventListener('pointerdown', () => Sonido.iniciar(), true);
window.addEventListener('keydown', () => Sonido.iniciar(), true);
document.getElementById('btn-sonido').addEventListener('pointerdown', (e) => { e.preventDefault(); Sonido.alternar(); });
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'm') Sonido.alternar(); });   // M = silenciar

// ---- Lienzo y escala -----------------------------------------------------
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
let escala = 1;                          // píxeles CSS por unidad del mundo

function ajustarTamano() {
  // Mayor tamaño que quepa manteniendo la proporción 9:16
  const cont = document.getElementById('escena');
  const estilo = getComputedStyle(cont);
  const disponibleX = cont.clientWidth - parseFloat(estilo.paddingLeft) - parseFloat(estilo.paddingRight);
  const disponibleY = cont.clientHeight - 16;
  escala = Math.min(disponibleX / ANCHO, disponibleY / ALTO);
  const dpr = window.devicePixelRatio || 1;
  lienzo.style.width = ANCHO * escala + 'px';
  lienzo.style.height = ALTO * escala + 'px';
  lienzo.width = Math.round(ANCHO * escala * dpr);   // nitidez en pantallas retina
  lienzo.height = Math.round(ALTO * escala * dpr);
  ctx.setTransform(escala * dpr, 0, 0, escala * dpr, 0, 0);
}
window.addEventListener('resize', ajustarTamano);

// ---- Entrada: teclado ----------------------------------------------------
const teclas = new Set();
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  teclas.add(k);
  if (k === ' ') { e.preventDefault(); accionMurcielago(); }
  if (k === 'e') accionNiebla();
  if ((k === 'r' || k === 'enter') && estado !== 'jugando') continuar();
});
window.addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));

// ---- Entrada: joystick táctil --------------------------------------------
// Al apoyar el dedo se fija el centro; arrastrar indica dirección e intensidad.
const joystick = { activo: false, id: null, origen: { x: 0, y: 0 }, actual: { x: 0, y: 0 } };
const RADIO_JOY = 60;                    // px CSS: tamaño visual del anillo
const ARRASTRE_MAX = 26;                 // px CSS de arrastre para ir a velocidad máxima

document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#poderes, #btn-sonido')) return;          // los botones tienen su propio manejo
  if (estado !== 'jugando') { continuar(); return; } // tocar para empezar / seguir
  if (joystick.activo) return;
  joystick.activo = true;
  joystick.id = e.pointerId;
  joystick.origen = { x: e.clientX, y: e.clientY };
  joystick.actual = { ...joystick.origen };
});
document.addEventListener('pointermove', (e) => {
  if (joystick.activo && e.pointerId === joystick.id) joystick.actual = { x: e.clientX, y: e.clientY };
});
const soltar = (e) => { if (e.pointerId === joystick.id) { joystick.activo = false; joystick.id = null; } };
document.addEventListener('pointerup', soltar);
document.addEventListener('pointercancel', soltar);

document.getElementById('btn-murcielago').addEventListener('pointerdown', (e) => { e.preventDefault(); accionMurcielago(); });
document.getElementById('btn-niebla').addEventListener('pointerdown', (e) => { e.preventDefault(); accionNiebla(); });

function accionMurcielago() {
  if (estado === 'jugando') vampiro.activarMurcielago();
  else continuar();
}
function accionNiebla() {
  if (estado === 'jugando') lanzarNiebla();
}

// Lee la dirección deseada combinando teclado y joystick (fuerza 0..1)
function leerMovimiento() {
  let x = 0, y = 0;
  if (teclas.has('arrowright') || teclas.has('d')) x += 1;
  if (teclas.has('arrowleft') || teclas.has('a')) x -= 1;
  if (teclas.has('arrowdown') || teclas.has('s')) y += 1;
  if (teclas.has('arrowup') || teclas.has('w')) y -= 1;
  if (x || y) return { ...normal({ x, y }), fuerza: 1 };
  if (joystick.activo) {
    const d = resta(joystick.actual, joystick.origen);
    const l = largo(d);
    if (l > 8) return { ...normal(d), fuerza: Math.min(1, l / ARRASTRE_MAX) };
  }
  return { x: 0, y: 0, fuerza: 0 };
}

// ---- Efectos visuales: partículas, textos flotantes y ondas ----------------
let particulas = [], textos = [], ondas = [];

function salpicar(x, y, color, cantidad = 14, vel = 160) {
  for (let i = 0; i < cantidad; i++) {
    const a = azar(0, Math.PI * 2), v = azar(vel * 0.3, vel);
    particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: azar(0.4, 0.8), r: azar(1.5, 3.5), color });
  }
}
function textoFlotante(x, y, t, color) { textos.push({ x, y, t, color, vida: 1 }); }

function actualizarEfectos(dt) {
  for (const p of particulas) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.vida -= dt; }
  particulas = particulas.filter((p) => p.vida > 0);
  for (const t of textos) { t.y -= 30 * dt; t.vida -= dt; }
  textos = textos.filter((t) => t.vida > 0);
  for (const o of ondas) o.r += 600 * dt;
  ondas = ondas.filter((o) => o.r < o.max);
}
function dibujarEfectos() {
  for (const o of ondas) {               // anillo de niebla expandiéndose
    const a = 1 - o.r / o.max;
    const g = ctx.createRadialGradient(o.x, o.y, o.r * 0.6, o.x, o.y, o.r);
    g.addColorStop(0, 'rgba(155,47,208,0)');
    g.addColorStop(1, `rgba(200,40,120,${0.55 * a})`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of particulas) {
    ctx.globalAlpha = Math.max(0, p.vida * 1.5);
    circulo(p.x, p.y, p.r, p.color);
  }
  ctx.globalAlpha = 1;
  for (const t of textos) {
    ctx.globalAlpha = Math.max(0, t.vida);
    texto(t.t, t.x, t.y, 18, t.color, 'cuerpo');
  }
  ctx.globalAlpha = 1;
}

// ---- Escenario: cementerio generado una vez por partida --------------------
let decorado = [];
function generarDecorado() {
  decorado = [];
  for (let i = 0; i < 16; i++) decorado.push({ tipo: 'tumba', x: azar(30, ANCHO - 30), y: azar(130, ALTO - 30), g: azar(-0.15, 0.15) });
  for (let i = 0; i < 7; i++) decorado.push({ tipo: 'arbol', x: azar(0, ANCHO), y: azar(0, ALTO), r: azar(26, 44) });
  for (let i = 0; i < 40; i++) decorado.push({ tipo: 'pasto', x: azar(0, ANCHO), y: azar(0, ALTO) });
  decorado.sort((a, b) => a.y - b.y);    // dibujar de atrás hacia delante
}
function dibujarFondo(t) {
  // Suelo con luz de luna en el centro
  const g = ctx.createRadialGradient(ANCHO * 0.6, ALTO * 0.35, 40, ANCHO / 2, ALTO / 2, 620);
  g.addColorStop(0, '#1d2a2a');
  g.addColorStop(1, '#0a0f12');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, ANCHO, ALTO);
  // Sendero de tierra
  ctx.strokeStyle = 'rgba(70,55,45,.45)'; ctx.lineWidth = 46; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-20, ALTO * 0.7);
  ctx.bezierCurveTo(ANCHO * 0.3, ALTO * 0.4, ANCHO * 0.6, ALTO * 0.9, ANCHO + 20, ALTO * 0.45); ctx.stroke();

  for (const d of decorado) {
    if (d.tipo === 'pasto') {
      ctx.strokeStyle = 'rgba(80,120,90,.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3, d.y - 7);
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 3, d.y - 7);
      ctx.stroke();
    } else if (d.tipo === 'tumba') {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.g);
      sombra(0, 4, 14, 5);
      ctx.fillStyle = '#4a4f5c';
      ctx.beginPath(); ctx.roundRect(-10, -22, 20, 26, [10, 10, 2, 2]); ctx.fill();
      ctx.fillStyle = '#5c6270';
      ctx.fillRect(-1.5, -17, 3, 12); ctx.fillRect(-5, -13, 10, 3);  // cruz grabada
      ctx.restore();
    } else if (d.tipo === 'arbol') {
      sombra(d.x + 6, d.y + 8, d.r, d.r * 0.5);
      circulo(d.x, d.y, d.r, '#0f1a17');
      circulo(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.55, '#152420');
    }
  }
  // Niebla flotante sutil
  for (let i = 0; i < 7; i++) {
    const x = ((t * 12 + i * 260) % (ANCHO + 300)) - 150;
    const y = 150 + i * 120;
    const n = ctx.createRadialGradient(x, y, 0, x, y, 150);
    n.addColorStop(0, 'rgba(180,190,210,.06)'); n.addColorStop(1, 'rgba(180,190,210,0)');
    ctx.fillStyle = n; ctx.fillRect(x - 150, y - 150, 300, 300);
  }
}

// ---- Entidades -----------------------------------------------------------
class Vampiro {
  static RADIO = 16; static VEL = 230; static VEL_MURC = 560; static DUR_MURC = 0.35;
  constructor() {
    this.pos = { x: ANCHO / 2, y: ALTO / 2 };
    this.dir = { x: 1, y: 0 };           // última dirección (para el impulso y la capa)
    this.sangre = SANGRE_MAX;
    this.tMurc = 0;                      // tiempo restante como murciélago
    this.tInv = 0;                       // tiempo restante de invulnerabilidad
    this.paso = 0;                       // para animar la capa al caminar
  }
  get esMurcielago() { return this.tMurc > 0; }
  activarMurcielago() {
    if (!this.esMurcielago && this.sangre > COSTO_MURCIELAGO) {
      this.sangre -= COSTO_MURCIELAGO;
      this.tMurc = Vampiro.DUR_MURC;
      Sonido.murcielago();
      salpicar(this.pos.x, this.pos.y, '#6e2a8c', 10, 120);
    }
  }
  actualizar(dt) {
    const m = leerMovimiento();
    if (m.fuerza > 0) this.dir = { x: m.x, y: m.y };
    if (this.esMurcielago) {             // impulso recto y rápido
      this.pos.x += this.dir.x * Vampiro.VEL_MURC * dt;
      this.pos.y += this.dir.y * Vampiro.VEL_MURC * dt;
      this.tMurc -= dt;
    } else {
      this.pos.x += m.x * m.fuerza * Vampiro.VEL * dt;
      this.pos.y += m.y * m.fuerza * Vampiro.VEL * dt;
      this.paso += m.fuerza * dt * 10;
    }
    limitar(this.pos, Vampiro.RADIO);
    this.sangre -= PERDIDA_SANGRE_SEG * dt;
    this.tInv = Math.max(0, this.tInv - dt);
  }
  recibirGolpe() {                       // true si de verdad recibió daño
    if (this.tInv > 0 || this.esMurcielago) return false;
    this.sangre -= DANO_CAZADOR;
    this.tInv = INVULNERABLE_SEG;
    Sonido.golpe();
    salpicar(this.pos.x, this.pos.y, '#c8142a', 18);
    return true;
  }
  dibujar(t) {
    if (this.tInv > 0 && Math.floor(this.tInv * 10) % 2 === 0) return; // parpadeo
    const { x, y } = this.pos;
    if (this.esMurcielago) {
      // Murciélago con alas que aletean
      const aleteo = Math.sin(t * 40) * 8;
      sombra(x, y + 18, 14, 4);
      ctx.fillStyle = '#2a1036';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x - 14, y - 14 - aleteo, x - 28, y - 6 - aleteo);
      ctx.quadraticCurveTo(x - 20, y + 2, x - 16, y + 8);
      ctx.quadraticCurveTo(x - 8, y + 2, x, y + 6);
      ctx.quadraticCurveTo(x + 8, y + 2, x + 16, y + 8);
      ctx.quadraticCurveTo(x + 20, y + 2, x + 28, y - 6 - aleteo);
      ctx.quadraticCurveTo(x + 14, y - 14 - aleteo, x, y);
      ctx.fill();
      circulo(x, y, 6, '#1a0a22');
      circulo(x - 2, y - 1, 1.5, '#ff3b4e');
      circulo(x + 2, y - 1, 1.5, '#ff3b4e');
      return;
    }
    sombra(x, y + 20, 18, 6);
    // Capa: triángulo detrás, opuesto a la dirección, con ondeo al caminar
    const atras = { x: -this.dir.x, y: -this.dir.y };
    const lado = { x: -atras.y, y: atras.x };
    const ondeo = Math.sin(this.paso) * 4;
    ctx.fillStyle = '#4a0010';
    ctx.beginPath();
    ctx.moveTo(x + lado.x * 16, y + lado.y * 16 + 4);
    ctx.lineTo(x + atras.x * 30 + lado.x * (10 + ondeo), y + atras.y * 30 + lado.y * (10 + ondeo) + 8);
    ctx.lineTo(x + atras.x * 30 - lado.x * (10 - ondeo), y + atras.y * 30 - lado.y * (10 - ondeo) + 8);
    ctx.lineTo(x - lado.x * 16, y - lado.y * 16 + 4);
    ctx.fill();
    // Cuerpo con cuello de capa rojo
    ctx.fillStyle = '#16121e';
    ctx.beginPath(); ctx.ellipse(x, y + 8, 13, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a3001c';
    tri(x - 14, y - 2, x - 4, y + 4, x - 12, y + 10);
    tri(x + 14, y - 2, x + 4, y + 4, x + 12, y + 10);
    // Cabeza pálida, pelo con pico de viuda, ojos rojos y colmillos
    circulo(x, y - 6, 11, '#e9e4ef');
    ctx.fillStyle = '#120d18';
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 8); ctx.quadraticCurveTo(x - 10, y - 19, x, y - 18);
    ctx.quadraticCurveTo(x + 10, y - 19, x + 11, y - 8);
    ctx.lineTo(x + 6, y - 12); ctx.lineTo(x, y - 7); ctx.lineTo(x - 6, y - 12);
    ctx.fill();
    circulo(x - 4, y - 6, 2.2, '#e0102c');
    circulo(x + 4, y - 6, 2.2, '#e0102c');
    ctx.fillStyle = '#ffffff';
    tri(x - 3, y, x - 2, y + 3.5, x - 1, y);
    tri(x + 1, y, x + 2, y + 3.5, x + 3, y);
  }
}

class Aldeano {
  static RADIO = 11; static VEL = 85; static VEL_HUIDA = 125; static VEL_CANSADO = 55; static MIEDO = 140;
  static AGUANTE = 2;                    // segundos que pueden correr antes de cansarse
  constructor() {
    this.pos = { x: azar(40, ANCHO - 40), y: azar(130, ALTO - 40) };
    const a = azar(0, Math.PI * 2);
    this.dir = { x: Math.cos(a), y: Math.sin(a) };
    this.tCambio = azar(1, 3);           // cuándo cambiar de rumbo
    this.ropa = elegir(['#3f6fc4', '#b5763a', '#4d8a5b', '#a4487a']);
    this.pelo = elegir(['#3b2416', '#c99a4a', '#1a1a1a', '#7a3b1e']);
    this.asustado = false;
    this.energia = Aldeano.AGUANTE;      // se gasta al huir y se recupera al calmarse
    this.paso = azar(0, 6);
  }
  actualizar(dt) {
    const lejos = resta(this.pos, vampiro.pos);
    const d = largo(lejos);
    this.asustado = d > 0 && d < Aldeano.MIEDO;
    if (this.asustado) {                 // huir del vampiro (más lento si está cansado)
      this.energia = Math.max(0, this.energia - dt);
      const vel = this.energia > 0 ? Aldeano.VEL_HUIDA : Aldeano.VEL_CANSADO;
      const n = normal(lejos);
      this.pos.x += n.x * vel * dt;
      this.pos.y += n.y * vel * dt;
      this.paso += dt * 16;
    } else {                             // paseo aleatorio
      this.energia = Math.min(Aldeano.AGUANTE, this.energia + dt * 0.5);   // recuperar el aliento
      this.tCambio -= dt;
      if (this.tCambio <= 0) {
        const giro = azar(-2.1, 2.1), c = Math.cos(giro), s = Math.sin(giro);
        this.dir = { x: this.dir.x * c - this.dir.y * s, y: this.dir.x * s + this.dir.y * c };
        this.tCambio = azar(1, 3);
      }
      this.pos.x += this.dir.x * Aldeano.VEL * dt;
      this.pos.y += this.dir.y * Aldeano.VEL * dt;
      this.paso += dt * 9;
    }
    const r = Aldeano.RADIO;             // rebotar en los bordes
    if (this.pos.x <= r || this.pos.x >= ANCHO - r) this.dir.x *= -1;
    if (this.pos.y <= r || this.pos.y >= ALTO - r) this.dir.y *= -1;
    limitar(this.pos, r);
  }
  dibujar() {
    const { x } = this.pos;
    const y = this.pos.y + Math.abs(Math.sin(this.paso)) * -2;  // saltito al caminar
    sombra(x, this.pos.y + 17, 11, 4);
    ctx.fillStyle = this.ropa;
    ctx.beginPath(); ctx.ellipse(x, y + 7, 10, 10, 0, 0, Math.PI * 2); ctx.fill();
    circulo(x, y - 6, 8, '#eac39c');
    ctx.fillStyle = this.pelo;
    ctx.beginPath(); ctx.arc(x, y - 7, 8, Math.PI, 0); ctx.fill();
    if (this.asustado && this.energia > 0) texto('!', x + 12, y - 16, 18, '#ffe08a', 'cuerpo');
    else if (this.asustado) {            // cansado: gota de sudor azul
      ctx.fillStyle = '#7fd0ff';
      ctx.beginPath(); ctx.moveTo(x + 11, y - 22);
      ctx.quadraticCurveTo(x + 16, y - 13, x + 11, y - 11);
      ctx.quadraticCurveTo(x + 6, y - 13, x + 11, y - 22); ctx.fill();
    }
  }
}

class Cazador {
  static RADIO = 14;
  constructor(vel) { this.pos = puntoEnBorde(); this.vel = vel; this.paso = azar(0, 6); this.mira = { x: 1, y: 0 }; }
  actualizar(dt) {                       // perseguir al vampiro
    this.mira = normal(resta(vampiro.pos, this.pos));
    this.pos.x += this.mira.x * this.vel * dt;
    this.pos.y += this.mira.y * this.vel * dt;
    this.paso += dt * 10;
  }
  dibujar() {
    const { x } = this.pos;
    const y = this.pos.y + Math.abs(Math.sin(this.paso)) * -2;
    sombra(x, this.pos.y + 19, 14, 5);
    // Estaca de madera apuntando al vampiro
    ctx.strokeStyle = '#a07040'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + this.mira.x * 6, y + 6 + this.mira.y * 6);
    ctx.lineTo(x + this.mira.x * 26, y + 6 + this.mira.y * 26);
    ctx.stroke();
    // Abrigo largo
    ctx.fillStyle = '#3d2a1c';
    ctx.beginPath(); ctx.roundRect(x - 12, y - 2, 24, 22, 7); ctx.fill();
    ctx.fillStyle = '#c9c9d1';                    // cinturón con hebilla de plata
    ctx.fillRect(x - 12, y + 8, 24, 3);
    circulo(x, y - 7, 9, '#d8ad86');              // cara
    ctx.fillStyle = '#111';                       // ojos serios
    ctx.fillRect(x - 5, y - 8, 3, 2); ctx.fillRect(x + 2, y - 8, 3, 2);
    // Sombrero de ala ancha
    ctx.fillStyle = '#17120e';
    ctx.beginPath(); ctx.ellipse(x, y - 13, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x - 8, y - 24, 16, 12, 3); ctx.fill();
    ctx.fillStyle = '#7a1414'; ctx.fillRect(x - 8, y - 16, 16, 3);   // cinta del sombrero
  }
}

// ---- Ayudas de dibujo ----------------------------------------------------
function circulo(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function sombra(x, y, rx, ry) {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}
function tri(x1, y1, x2, y2, x3, y3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
}
function texto(t, x, y, tam, color, fuente = 'cuerpo', alin = 'center') {
  ctx.fillStyle = color;
  ctx.textAlign = alin;
  ctx.textBaseline = 'middle';
  ctx.font = `${fuente === 'display' ? '' : '600 '}${tam}px ${fuente === 'display' ? '"Pirata One", Georgia, serif' : 'Rubik, system-ui, sans-serif'}`;
  ctx.fillText(t, x, y);
}

// ---- Estado del juego ----------------------------------------------------
// 'inicio' | 'jugando' | 'amanecer' (noche superada) | 'fin' (sin sangre)
let estado = 'inicio';
let momentoPausa = 0;                    // cuándo apareció la última pantalla de pausa
// Evita saltar la pantalla por accidente con un toque justo al cambiar
const puedeContinuar = () => performance.now() - momentoPausa > 800;
let vampiro, aldeanos, cazadores, tiempoNoche, noche, mordidas, eliminados, cargaNiebla, tSpawn, tiempoTotal;

// Récord guardado en el navegador (puede no estar disponible: try/catch)
let mejor = 0;
try { mejor = Number(localStorage.getItem('vampiro-record')) || 0; } catch (_) {}
function guardarRecord() { try { localStorage.setItem('vampiro-record', String(mejor)); } catch (_) {} }

// Puntos: 1 por segundo, 10 por mordida, 15 por cazador, 100 por noche superada
const puntaje = () => Math.floor(tiempoTotal) + mordidas * 10 + eliminados * 15 + (noche - 1) * 100;

function nuevaPartida() {
  noche = 1; mordidas = 0; eliminados = 0; cargaNiebla = 0; tiempoTotal = 0;
  vampiro = new Vampiro();
  empezarNoche();
}
function empezarNoche() {
  // Cada noche: escenario nuevo, sin cazadores, sangre al máximo
  generarDecorado();
  vampiro.pos = { x: ANCHO / 2, y: ALTO / 2 };
  vampiro.sangre = SANGRE_MAX;
  aldeanos = Array.from({ length: MAX_ALDEANOS }, () => new Aldeano());
  cazadores = [];
  particulas = []; textos = []; ondas = [];
  tiempoNoche = 0;
  tSpawn = 2.5;
  estado = 'jugando';
}
function continuar() {                   // toque en una pantalla de pausa
  if (!puedeContinuar()) return;
  if (estado === 'amanecer') { noche++; empezarNoche(); }
  else nuevaPartida();                   // 'inicio' o 'fin'
}

// Onda de niebla: elimina a los cazadores dentro del radio
function lanzarNiebla() {
  if (cargaNiebla < MORDIDAS_PARA_NIEBLA) return;
  cargaNiebla = 0;
  Sonido.niebla();
  ondas.push({ x: vampiro.pos.x, y: vampiro.pos.y, r: 10, max: RADIO_NIEBLA });
  cazadores = cazadores.filter((c) => {
    if (largo(resta(c.pos, vampiro.pos)) < RADIO_NIEBLA) { eliminarCazador(c); return false; }
    return true;
  });
}
function eliminarCazador(c) {
  eliminados++;
  Sonido.eliminar();
  salpicar(c.pos.x, c.pos.y, '#9b2fd0', 16);
  salpicar(c.pos.x, c.pos.y, '#3d2a1c', 8, 100);
  textoFlotante(c.pos.x, c.pos.y - 20, '+15', '#d9a6ff');
}

function actualizar(dt) {
  actualizarEfectos(dt);
  if (estado !== 'jugando') return;
  tiempoNoche += dt;
  tiempoTotal += dt;
  vampiro.actualizar(dt);

  // Aparición de cazadores, con un máximo según la noche
  tSpawn -= dt;
  if (tSpawn <= 0) {
    if (cazadores.length < maxCazadores(noche)) {
      cazadores.push(new Cazador(velCazador(noche, tiempoNoche)));
      Sonido.cazadorAparece();
    }
    tSpawn = intervaloSpawn(noche);
  }
  aldeanos.forEach((a) => a.actualizar(dt));
  cazadores.forEach((c) => c.actualizar(dt));

  // Mordidas: dan sangre y cargan la niebla
  aldeanos = aldeanos.filter((a) => {
    if (largo(resta(a.pos, vampiro.pos)) < Aldeano.RADIO + Vampiro.RADIO) {
      vampiro.sangre = Math.min(SANGRE_MAX, vampiro.sangre + SANGRE_POR_MORDIDA);
      mordidas++;
      if (cargaNiebla === MORDIDAS_PARA_NIEBLA - 1) Sonido.nieblaLista();   // se acaba de cargar
      cargaNiebla = Math.min(MORDIDAS_PARA_NIEBLA, cargaNiebla + 1);
      Sonido.mordida();
      salpicar(a.pos.x, a.pos.y, '#c8142a', 20);
      textoFlotante(a.pos.x, a.pos.y - 20, '+25 sangre', '#ff6b7d');
      return false;
    }
    return true;
  });
  while (aldeanos.length < MAX_ALDEANOS) aldeanos.push(new Aldeano());

  // Choques con cazadores
  cazadores = cazadores.filter((c) => {
    const d = resta(c.pos, vampiro.pos);
    if (largo(d) >= Cazador.RADIO + Vampiro.RADIO + 4) return true;
    if (vampiro.esMurcielago) { eliminarCazador(c); return false; }  // el murciélago los atraviesa
    if (vampiro.recibirGolpe()) {
      const n = normal(d);               // empujón para no recibir golpes seguidos
      c.pos.x += n.x * 70; c.pos.y += n.y * 70;
    }
    return true;
  });

  if (vampiro.sangre <= 0) {             // derrota
    vampiro.sangre = 0;
    estado = 'fin';
    momentoPausa = performance.now();
    Sonido.derrota();
    if (puntaje() > mejor) { mejor = puntaje(); guardarRecord(); }
  } else if (tiempoNoche >= DURACION_NOCHE) {   // ¡sobrevivió hasta el amanecer!
    estado = 'amanecer';
    momentoPausa = performance.now();
    Sonido.amanecer();
    if (puntaje() + 100 > mejor) { mejor = puntaje() + 100; guardarRecord(); }
  }
}

// ---- Interfaz (HUD) ------------------------------------------------------
function barra(x, y, w, h, valor, color) {
  ctx.fillStyle = 'rgba(20,16,30,.85)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x + 2, y + 2, Math.max(0, (w - 4) * valor), h - 4, (h - 4) / 2); ctx.fill();
}
function dibujarHud() {
  barra(20, 18, 210, 20, vampiro.sangre / SANGRE_MAX, vampiro.sangre < 30 ? '#ff2a45' : '#c8142a');
  texto('Sangre', 240, 28, 15, '#efe9e1', 'cuerpo', 'left');
  barra(20, 44, 210, 12, cargaNiebla / MORDIDAS_PARA_NIEBLA, '#9b2fd0');
  texto(cargaNiebla >= MORDIDAS_PARA_NIEBLA ? 'Niebla lista' : 'Niebla', 240, 50, 13, '#d9a6ff', 'cuerpo', 'left');
  texto(`Mordidas ${mordidas}  ·  Cazadores ${eliminados}  ·  Puntos ${puntaje()}`, 20, 100, 14, '#a9a3c2', 'cuerpo', 'left');

  // Arriba a la derecha: noche actual y cuenta regresiva al amanecer (con sol que sube)
  const restante = Math.max(0, Math.ceil(DURACION_NOCHE - tiempoNoche));
  texto(`Noche ${noche}`, ANCHO - 20, 28, 30, '#e8e4c9', 'display', 'right');
  texto(`Amanecer en ${restante} s`, ANCHO - 20, 58, 14, restante <= 10 ? '#ffcf6b' : '#a9a3c2', 'cuerpo', 'right');
  barra(ANCHO - 150, 70, 130, 8, tiempoNoche / DURACION_NOCHE, '#ffb347');
}

function dibujarJoystick() {             // anillo y pulgar del joystick virtual
  if (!joystick.activo) return;
  const r = lienzo.getBoundingClientRect();
  const o = { x: (joystick.origen.x - r.left) / escala, y: (joystick.origen.y - r.top) / escala };
  let d = resta(joystick.actual, joystick.origen);
  const l = largo(d);
  if (l > RADIO_JOY) d = { x: d.x / l * RADIO_JOY, y: d.y / l * RADIO_JOY };
  ctx.strokeStyle = 'rgba(239,233,225,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(o.x, o.y, RADIO_JOY / escala, 0, Math.PI * 2); ctx.stroke();
  circulo(o.x + d.x / escala, o.y + d.y / escala, 18 / escala, 'rgba(200,20,42,.6)');
}

function velo(color = 'rgba(0,0,0,.68)') { ctx.fillStyle = color; ctx.fillRect(0, 0, ANCHO, ALTO); }

// Luz de amanecer: el borde superior se tiñe de naranja en los últimos 10 s
function luzAmanecer() {
  const f = Math.max(0, (tiempoNoche - (DURACION_NOCHE - 10)) / 10);
  if (f <= 0) return;
  const g = ctx.createLinearGradient(0, 0, 0, ALTO);
  g.addColorStop(0, `rgba(255,150,60,${0.35 * f})`);
  g.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, ANCHO, ALTO);
}

// Pequeña galería de personajes para la pantalla de inicio
function leyenda(y) {
  const items = [
    ['Tú', () => { const v = new Vampiro(); v.pos = { x: 0, y: 0 }; return v; }],
    ['Aldeano\nmuérdelo', () => { const a = new Aldeano(); a.pos = { x: 0, y: 0 }; a.ropa = '#3f6fc4'; return a; }],
    ['Cazador\nevítalo o elimínalo', () => { const c = new Cazador(0); c.pos = { x: 0, y: 0 }; c.mira = { x: 1, y: 0 }; return c; }],
  ];
  items.forEach(([nombre, crear], i) => {
    const cx = ANCHO / 2 + (i - 1) * 170;
    const e = crear();
    ctx.save(); ctx.translate(cx, y); e.dibujar(0); ctx.restore();
    nombre.split('\n').forEach((l, j) => texto(l, cx, y + 44 + j * 20, 15, j ? '#a9a3c2' : '#efe9e1'));
  });
}

function dibujar(t) {
  dibujarFondo(t);
  if (estado === 'inicio') {
    velo();
    texto('Vampiro', ANCHO / 2, 190, 110, '#c8142a', 'display');
    texto('Sobrevive cada noche', ANCHO / 2, 285, 22, '#efe9e1');
    texto('hasta el amanecer.', ANCHO / 2, 315, 22, '#efe9e1');
    leyenda(410);
    texto('Murciélago', ANCHO / 2, 540, 20, '#ff8a98');
    texto('impulso que atraviesa y elimina cazadores', ANCHO / 2, 566, 15, '#efe9e1');
    texto('(cuesta un poco de sangre)', ANCHO / 2, 588, 15, '#a9a3c2');
    texto('Niebla roja', ANCHO / 2, 632, 20, '#d9a6ff');
    texto('muerde 4 aldeanos para cargarla y elimina', ANCHO / 2, 658, 15, '#efe9e1');
    texto('a todos los cazadores cercanos', ANCHO / 2, 680, 15, '#efe9e1');
    texto('Arrastra el dedo para moverte', ANCHO / 2, 730, 14, '#a9a3c2');
    texto('Toca para empezar', ANCHO / 2, 810, 36, '#e8e4c9', 'display');
    if (mejor) texto(`Récord: ${mejor}`, ANCHO / 2, 860, 15, '#a9a3c2');
    return;
  }
  // Ordenar por altura para que lo de abajo tape lo de arriba
  const todos = [...aldeanos, ...cazadores, vampiro].sort((a, b) => a.pos.y - b.pos.y);
  todos.forEach((e) => e.dibujar(t));
  dibujarEfectos();
  luzAmanecer();
  dibujarHud();
  dibujarJoystick();

  if (estado === 'amanecer') {
    velo('rgba(40,15,0,.6)');
    texto('¡Amaneció!', ANCHO / 2, ALTO / 2 - 90, 84, '#ffb347', 'display');
    texto(`Sobreviviste la noche ${noche}.`, ANCHO / 2, ALTO / 2 - 10, 20, '#efe9e1');
    texto('Te escondes en tu ataúd hasta la próxima.', ANCHO / 2, ALTO / 2 + 18, 17, '#efe9e1');
    texto(`Puntos: ${puntaje() + 100}  (+100 por la noche)`, ANCHO / 2, ALTO / 2 + 56, 18, '#ffcf6b');
    texto(`Toca para empezar la noche ${noche + 1}`, ANCHO / 2, ALTO / 2 + 130, 30, '#e8e4c9', 'display');
  } else if (estado === 'fin') {
    velo();
    texto('Te quedaste', ANCHO / 2, ALTO / 2 - 130, 64, '#c8142a', 'display');
    texto('sin sangre', ANCHO / 2, ALTO / 2 - 70, 64, '#c8142a', 'display');
    texto(`Llegaste a la noche ${noche}`, ANCHO / 2, ALTO / 2, 20, '#efe9e1');
    texto(`Puntos: ${puntaje()}   ·   Récord: ${mejor}`, ANCHO / 2, ALTO / 2 + 30, 20, '#efe9e1');
    texto('Toca para volver a intentarlo', ANCHO / 2, ALTO / 2 + 110, 30, '#e8e4c9', 'display');
  }
}

// Actualiza el aspecto de los botones (carga de la niebla)
const btnNiebla = document.getElementById('btn-niebla');
const cargaEl = document.getElementById('carga-niebla');
const poderesEl = document.getElementById('poderes');
function actualizarBotones() {
  // Los botones solo se muestran durante la partida (no tapan los menús)
  poderesEl.hidden = estado !== 'jugando';
  const f = estado === 'jugando' ? cargaNiebla / MORDIDAS_PARA_NIEBLA : 0;
  cargaEl.style.height = f * 100 + '%';
  btnNiebla.classList.toggle('listo', f >= 1);
}

// ---- Bucle principal -----------------------------------------------------
let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000);   // limitar saltos (pestaña en segundo plano)
  ultimo = ahora;
  actualizar(dt);
  Sonido.actualizar(dt);
  dibujar(ahora / 1000);
  actualizarBotones();
  requestAnimationFrame(bucle);
}

nuevaPartida();
estado = 'inicio';                       // mostrar primero la pantalla de inicio
ajustarTamano();
requestAnimationFrame(bucle);
</script>
